[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tarotgen"
version = "0.1.0"
description = "DevOps Tarot card generator and site builder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow",
    "PyYAML",
    "openai",
]

[project.scripts]
tarotgen-generate = "tarotgen.generator:main"
tarotgen-build = "tarotgen.builder:main"
tarotgen-serve = "tarotgen.server:main"
tarotgen-samples = "tarotgen.samples:main"
tarotgen-preview = "tarotgen.preview:main"
tarotgen-favicon = "tarotgen.favicon:main"

[tool.setuptools.packages.find]
where = ["src"]
